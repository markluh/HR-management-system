spring:
  application:
    name: hr-system
  datasource:
    url: jdbc:h2:mem:hrdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 75MB

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: info
